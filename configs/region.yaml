# Region-only ablation: VES(t) = RegionEvidence(t).
#
# REQUIRES a grounding backend. Run with:
#   python -m src.run --benchmark pope --method region \
#       --grounding-backend hf_grounding_dino
#
# With --grounding-backend none the run is REJECTED, not degraded: every candidate
# would score the same VES, so the penalty could never re-order anything and the
# run would be indistinguishable from unmodified greedy while claiming to be a
# region ablation. That is a misleading result, not a weaker one.

defaults: visualguard

alpha: 0.0
beta: 0.0
gamma: 1.0
lam: 0.5
threshold: 0.35

penalise_function_words: false
