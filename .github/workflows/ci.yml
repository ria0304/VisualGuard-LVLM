name: CI (tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # CPU wheels: ~200 MB instead of ~2.5 GB of CUDA libraries.
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Check src/data is tracked (guards against a bad .gitignore)
        run: |
          test -f src/data/__init__.py && test -f src/data/pope.py && test -f src/data/mme.py

      - name: Syntax check
        run: python -m compileall -q src tests scripts

      - name: Run tests
        run: python -m pytest tests -q
